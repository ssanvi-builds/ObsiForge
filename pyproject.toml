[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obsiforge"
version = "0.1.0"
description = "One-command Claude Code + Obsidian + Memory integration"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "ObsiForge Contributors" },
]
keywords = ["claude", "obsidian", "mcp", "memory", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.15.0",
    "rich>=13.0.0",
    "questionary>=2.1.0",
    "httpx>=0.28.0",
]

[project.scripts]
obsiforge = "obsiforge.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/obsiforge"]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
strict = true